version: 2

updates:
  - package-ecosystem: npm
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Lagos

    open-pull-requests-limit: 5

    commit-message:
      prefix: deps

    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/*"

  - package-ecosystem: github-actions
    directory: /

    schedule:
      interval: weekly
      day: friday
      time: "08:00"
      timezone: Africa/Lagos

    open-pull-requests-limit: 3

    commit-message:
      prefix: ci
