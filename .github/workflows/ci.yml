name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3000
  APP_BASE_URL: http://127.0.0.1:3000
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/asset_mgmt_test
  SESSION_SECRET: ci-only-session-secret-never-use-this-value-outside-github-actions-1234567890abcdef
  INITIAL_ADMIN_EMAIL: ci-superadmin@example.com
  INITIAL_ADMIN_PASSWORD: "CI-only-Strong-Administrator-Password-2026!"
  NEWSLETTER_UNSUBSCRIBE_SECRET: ci-only-newsletter-unsubscribe-secret-never-use-outside-tests-2026-1234567890abcdef
  LOG_LEVEL: silent

jobs:
  validate:
    name: Validate application

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_mgmt_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d asset_mgmt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check JavaScript and Prisma schema
        run: npm run check

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Check migration status
        run: npm run prisma:migrate:status

      - name: Run automated tests
        run: npm test

      - name: Verify initial administrator seed
        run: |
          node prisma/seed.js
          node prisma/seed.js

      - name: Start application and run smoke tests
        shell: bash
        run: |
          set -euo pipefail

          npm start > server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail \
              http://127.0.0.1:3000/healthz \
              > /dev/null
            then
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null
            then
              echo "The application stopped before becoming healthy."
              cat server.log
              exit 1
            fi

            sleep 2
          done

          echo "Checking application health..."
          curl --fail --show-error \
            http://127.0.0.1:3000/healthz

          echo
          echo "Checking database readiness..."
          curl --fail --show-error \
            http://127.0.0.1:3000/readyz

      - name: Show application log after failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi

  dependency-audit:
    name: Dependency audit

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit
